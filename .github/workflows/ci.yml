name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       surveillance_test
          POSTGRES_USER:     test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install deps
        run: pip install -e ".[dev]"

      - name: Run tests
        env:
          DATABASE_URL:      postgresql+asyncpg://test:test@localhost:5432/surveillance_test
          SECRET_KEY:        ci-test-secret
          ENVIRONMENT:       test
          REDIS_URL:         redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/0
          UPLOAD_DIR:        /tmp/uploads
          FRAMES_DIR:        /tmp/frames
          MODEL_PATH:        /tmp/model.pt
          CONFIDENCE_THRESHOLD: "0.75"
        run: pytest tests/ -v --tb=short

  test-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Install + build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-surveillance:${{ github.sha }} .

      - name: Tag latest
        run: docker tag ai-surveillance:${{ github.sha }} ai-surveillance:latest

      # Uncomment to push to your registry:
      # - name: Push to GHCR
      #   run: |
      #     echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      #     docker push ghcr.io/${{ github.repository }}:latest