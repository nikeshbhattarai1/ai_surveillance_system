upstream api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 512M;   # Match MAX_UPLOAD_SIZE_MB

    # Serve React SPA
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;  # SPA fallback
    }

    # Proxy auth calls (register/login/refresh/me — not under /api/)
    location /auth/ {
        proxy_pass         http://api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Proxy API calls
    location /api/ {
        proxy_pass         http://api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;             # Long timeout for video uploads
    }

    # WebSocket — critical headers for WS upgrade
    location /ws/ {
        proxy_pass             http://api;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "Upgrade";
        proxy_set_header       Host       $host;
        proxy_read_timeout     3600s;     # Keep WS alive for 1hr
    }

    # Health check passthrough
    location /health {
        proxy_pass         http://api;
        proxy_set_header   Host $host;
    }

    # Static frame evidence files
    location /frames/ {
        alias /app/storage/frames/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}