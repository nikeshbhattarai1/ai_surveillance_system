[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-surveillance-system"
version = "1.0.0"
description = "AI-powered video surveillance and violence detection system"
requires-python = ">=3.11"
dependencies = [

    # Web framework 
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",

    # Config + validation 
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.0.0",

    # Database 
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.1",

    # Async file I/O
    "aiofiles>=23.2.0",

    #  ML 
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",

    # Task queue 
    "celery>=5.4.0",
    "redis>=5.0.0",

    # Notifications 
    "twilio>=9.0.0",

]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-env>=1.1.0",
    "httpx>=0.27.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "tensorboard>=2.17.0",
    "torchinfo>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = ["py311"]
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = [
    "B008",
    "N999",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
